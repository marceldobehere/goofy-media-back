services:
  goofy_media_v1:
    container_name: goofy_media_v1
    build: .
    volumes:
      - "/etc/letsencrypt:/etc/letsencrypt"
      - "/home/pub/app-data/goofy-media-back/data:/srv/data"
    networks:
      - "nginx-router_default"
      - "default"
    restart: always

volumes:
  data:
networks:
  default:
  nginx-router_default:
    external: true